upload_max_filesize = 64M
post_max_size = 64M
max_input_vars = 5000
display_errors = Off
log_errors = On
error_reporting = E_ALL & ~E_NOTICE & ~E_WARNING

; OPcache: riduce sensibilmente i tempi di risposta cachando il bytecode compilato
; (il gestionale include molti file PHP ad ogni richiesta, essendo basato su un
; router legacy e non su un framework con route caching).
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 256
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 1
opcache.revalidate_freq = 2
opcache.save_comments = 1
